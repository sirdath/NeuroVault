# Contributor License Agreement check.
#
# WHY: the project must be able to relicense its own code — to add a patent
# grant, adopt a stronger copyleft, or move under a foundation. That permission
# can only be collected at contribution time; asking retroactively means
# tracking down every past contributor (VLC spent three years at it and still
# had to rewrite code from one who never replied). See CLA.md for what is and
# is not granted, and CORE-COVENANT.md for the commitments made in return.
#
# The signature is a PR comment; the bot records it in a file on the
# `cla-signatures` branch, so a contributor signs once and never again.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Stored on a side branch so the main history stays clean.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/sirdath/NeuroVault/blob/main/CLA.md
          custom-notsigned-prcomment: >
            Thanks for the contribution — this project needs one thing before it can
            merge community code: a one-time Contributor License Agreement.
            Please read **[CLA.md](https://github.com/sirdath/NeuroVault/blob/main/CLA.md)**
            (it is short, you keep your copyright, and it explains exactly why the
            relicensing clause exists), then post this comment on this PR:
          custom-pr-signed-comment: >
            Signed, recorded, and it covers every future contribution you make here.
            Thank you — welcome aboard.
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. ✅
          # The maintainer owns the copyright already; bots never sign.
          allowlist: sirdath,dependabot[bot],github-actions[bot]
